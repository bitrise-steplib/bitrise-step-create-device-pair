format_version: "15"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  check:
    steps:
    - git::https://github.com/bitrise-steplib/steps-check.git: { }

  e2e:
    steps:
    - git::https://github.com/bitrise-steplib/steps-check.git:
          inputs:
          - workflow: e2e

  generate_readme:
    steps:
    - git::https://github.com/bitrise-steplib/steps-readme-generator.git@main:
          inputs:
          - example_section: docs/examples.md

  sample:
    envs:
    - IPHONE_DEVICE: iPhone 17 Pro Max
    - IOS_VERSION: "26.4"
    - WATCH_DEVICE: Apple Watch Series 11 (46mm)
    - WATCHOS_VERSION: "26.4"
    steps:
    - path::./:
          title: Create Device Pair
          inputs:
          - iphone_device: $IPHONE_DEVICE
          - ios_version: $IOS_VERSION
          - watch_device: $WATCH_DEVICE
          - watchos_version: $WATCHOS_VERSION
    - script:
          title: Verify output
          inputs:
          - content: |
              #!/bin/bash
              set -ex
              echo "Device Pair ID: $BITRISE_DEVICE_PAIR_UDID"
              if [ -z "$BITRISE_DEVICE_PAIR_UDID" ]; then
                echo "ERROR: BITRISE_DEVICE_PAIR_UDID is empty"
                exit 1
              fi
